<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritish Lamsal · Life Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0c;
      --sidebar: #0f0f12;
      --surface: #15151a;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-dim: #8a8a96;
      --accent: #6ee7b7;
      --today: #22d3ee;
      --hover: #1a1a22;
      --sidebar-w-exp: 220px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* ── Compact three-line toggle ────────────────────── */
    .menu-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 40;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .menu-btn:hover {
      border-color: var(--accent);
      background: #1a1a22;
      box-shadow: 0 0 0 1px rgba(110, 231, 183, 0.15);
    }

    .menu-btn .line {
      display: block;
      width: 14px;
      height: 1.5px;
      background: var(--text-dim);
      border-radius: 1px;
      transition: background 0.15s, transform 0.2s, opacity 0.2s;
    }

    .menu-btn:hover .line {
      background: var(--accent);
    }

    /* X when open */
    .menu-btn.open .line:nth-child(1) {
      transform: translateY(5.5px) rotate(45deg);
      background: var(--accent);
    }
    .menu-btn.open .line:nth-child(2) {
      opacity: 0;
    }
    .menu-btn.open .line:nth-child(3) {
      transform: translateY(-5.5px) rotate(-45deg);
      background: var(--accent);
    }

    /* ── Sidebar ─────────────────────────────────────── */
    aside {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w-exp);
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 52px 0 20px;   /* top space so brand sits below the hamburger */
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.35);
    }

    aside.open {
      transform: translateX(0);
    }

    .brand {
      padding: 0 18px 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      line-height: 1.3;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 10px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      width: 100%;
    }

    .nav-item:hover {
      background: var(--hover);
      color: var(--text);
      border-color: var(--border);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.12), rgba(34, 211, 238, 0.08));
      color: var(--accent);
      border-color: rgba(110, 231, 183, 0.25);
    }

    .nav-item .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .nav-item.active .icon {
      opacity: 1;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 20;
    }

    .overlay.visible {
      display: block;
    }

    main {
      flex: 1;
      min-width: 0;
      position: relative;
      background: var(--bg);
      width: 100%;
    }

    .panel {
      position: absolute;
      inset: 0;
      border: none;
      width: 100%;
      height: 100%;
      display: none;
      background: var(--bg);
    }

    .panel.active {
      display: block;
    }
  </style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">
    <span class="line"></span>
    <span class="line"></span>
    <span class="line"></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <div class="layout">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-title">RITISH LAMSAL</div>
        <div class="brand-sub">PERSONAL LIFE TOOLS</div>
      </div>

      <nav>

            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
          </svg>
          Memento Mori
        </button>

        <button class="nav-item" data-panel="age" id="navAge">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <path d="M9 16l2 2 4-4"/>
          </svg>
          Age Calendar
        </button>
      </nav>
    </aside>

    <main>
      <iframe
        class="panel active"
        id="panel-memento"
        title="Memento Mori — Life Calendar"

  &lt;style&gt;
    :root {
      --bg: #0a0a0c;
      --surface: #121216;
      --surface-2: #1a1a20;
      --border: #2a2a32;

    .progress-fill {

  &lt;!-- WEEKS --&gt;
  &lt;div id=&quot;weeksView&quot; class=&quot;grid-view&quot;&gt;
    &lt;div class=&quot;stats-bar&quot; id=&quot;weeksStats&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;full-grid weeks-full&quot; id=&quot;weeksGrid&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- MONTHS --&gt;
  &lt;div id=&quot;monthsView&quot; class=&quot;grid-view&quot;&gt;
    &lt;div class=&quot;stats-bar&quot; id=&quot;monthsStats&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;full-grid months-full&quot; id=&quot;monthsGrid&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;tooltip&quot;&gt;
    &lt;div class=&quot;tt-title&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;tt-line&quot; id=&quot;ttDates&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;tt-line&quot; id=&quot;ttAges&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    // ─── Constants ───────────────────────────────────────────────
    const BIRTH = new Date(2007, 5, 15);
    const END   = new Date(2085, 5, 14);
    const TOTAL_DAYS   = 28490;
    const TOTAL_WEEKS  = 4070;
    const TOTAL_MONTHS = 936;
    const WEEK_START  = 5;
    const ROW_H = 148;
    const BUFFER = 6;
    const MONTHS = [&quot;JAN&quot;,&quot;FEB&quot;,&quot;MAR&quot;,&quot;APR&quot;,&quot;MAY&quot;,&quot;JUN&quot;,&quot;JUL&quot;,&quot;AUG&quot;,&quot;SEP&quot;,&quot;OCT&quot;,&quot;NOV&quot;,&quot;DEC&quot;];

    // ─── Helpers ─────────────────────────────────────────────────
    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }
    function daysBetween(a, b) {
      const u1 = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
      const u2 = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.floor((u2 - u1) / 86400000);
    }
    function formatDate(d) {
      return `${d.getFullYear()}-${MONTHS[d.getMonth()]}-${String(d.getDate()).padStart(2,&quot;0&quot;)}`;
    }
    function ageYMD(target) {
      let y = target.getFullYear() - BIRTH.getFullYear();
      let m = target.getMonth() - BIRTH.getMonth();
      let d = target.getDate() - BIRTH.getDate();
      if (d &lt; 0) { m--; d += new Date(target.getFullYear(), target.getMonth(), 0).getDate(); }
      if (m &lt; 0) { y--; m += 12; }
      const ys = String(Math.max(0,y)).padStart(2,&quot;0&quot;);
      const ms = String(Math.max(0,m)).padStart(2,&quot;0&quot;);
      const ds = String(Math.max(0,d)).padStart(2,&quot;0&quot;);
      return { y: ys, m: ms, d: ds, str: () =&gt; `${ys}Y-${ms}M-${ds}D` };
    }
    function isSameDay(a, b) {
      return a.getFullYear()===b.getFullYear() &amp;&amp; a.getMonth()===b.getMonth() &amp;&amp; a.getDate()===b.getDate();
    }
    function startOfWeek(d) {
      const day = d.getDay();
      return addDays(d, -((day - WEEK_START + 7) % 7));
    }
    function lifeWeek(date) {
      return Math.floor(daysBetween(firstWeekStart, startOfWeek(date)) / 7) + 1;
    }

    const firstWeekStart = startOfWeek(BIRTH);
    const TOTAL_WEEKS_CALC = Math.floor(daysBetween(firstWeekStart, startOfWeek(END)) / 7) + 1;

    function customMonthStart(m) {
      const d = new Date(BIRTH);
      d.setMonth(d.getMonth() + (m - 1));
      d.setDate(15);
      return d;
    }
    function customMonthEnd(m) {
      const start = customMonthStart(m);
      const end = new Date(start);
      end.setMonth(end.getMonth() + 1);
      end.setDate(14);
      return end;
    }
    function lifeMonth(date) {
      let y = date.getFullYear() - 2007;
      let m = date.getMonth() - 5;
      let day = date.getDate();
      let idx = y * 12 + m + 1;
      if (day &lt; 15) idx -= 1;
      return Math.max(1, Math.min(TOTAL_MONTHS, idx));
    }

    // ─── Progress + Days stats ───────────────────────────────────
    function updateProgressAndDaysStats() {
      const today = new Date(); today.setHours(0,0,0,0);
      let current = daysBetween(BIRTH, today) + 1;
      if (current &lt; 1) current = 1;
      if (current &gt; TOTAL_DAYS) current = TOTAL_DAYS;

      const lived = Math.max(0, current - 1);
      const remaining = TOTAL_DAYS - current;

      const pct = (current / TOTAL_DAYS) * 100;
      document.getElementById(&quot;progressFill&quot;).style.width = pct + &quot;%&quot;;
      document.getElementById(&quot;progressPct&quot;).textContent = pct.toFixed(2).padStart(5,&quot;0&quot;) + &quot;%&quot;;

      document.getElementById(&quot;daysStats&quot;).innerHTML = `
        &lt;span&gt;Lived &lt;strong&gt;${lived}&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;current-label&quot;&gt;Current &lt;strong&gt;${current}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Remaining &lt;strong&gt;${remaining}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Total &lt;strong&gt;${TOTAL_DAYS}&lt;/strong&gt;&lt;/span&gt;
      `;
    }

    // ─── Day view ────────────────────────────────────────────────
    const scroller = document.getElementById(&quot;scroller&quot;);
    const viewport = document.getElementById(&quot;viewport&quot;);
    const content  = document.getElementById(&quot;content&quot;);
    viewport.style.height = `${TOTAL_WEEKS_CALC * ROW_H}px`;

    function renderDays() {
      const scrollTop = scroller.scrollTop;
      const viewH = scroller.clientHeight;
      let startWeek = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
      let endWeek   = Math.min(TOTAL_WEEKS_CALC - 1, Math.ceil((scrollTop + viewH) / ROW_H) + BUFFER);

      const frag = document.createDocumentFragment();
      const today = new Date(); today.setHours(0,0,0,0);

      for (let w = startWeek; w &lt;= endWeek; w++) {
        const weekStart = addDays(firstWeekStart, w * 7);
        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;week-row&quot;;
        row.style.cssText = `position:absolute;top:${w*ROW_H}px;left:0;right:0`;

        for (let i = 0; i &lt; 7; i++) {
          const cellDate = addDays(weekStart, i);
          const card = document.createElement(&quot;div&quot;);
          if (cellDate &lt; BIRTH || cellDate &gt; END) {
            card.className = &quot;day empty&quot;;
            row.appendChild(card);
            continue;
          }
          const num = daysBetween(BIRTH, cellDate) + 1;
          const weekN = lifeWeek(cellDate);
          const age = ageYMD(cellDate);
          const isPast = cellDate &lt; today;
          const isToday = isSameDay(cellDate, today);
          const isFuture = cellDate &gt; today;

          card.className = &quot;day&quot;;
          if (isPast) card.classList.add(&quot;past&quot;);
          if (isToday) card.classList.add(&quot;today&quot;);
          if (isFuture) { card.classList.add(&quot;future&quot;); card.classList.add(&quot;f&quot;+(w%7)); }

          card.innerHTML = `
            &lt;div class=&quot;line&quot;&gt;${formatDate(cellDate)}&lt;/div&gt;
            &lt;div class=&quot;line&quot;&gt;${age.y}Y-${age.m}M-${age.d}D&lt;/div&gt;
            &lt;div class=&quot;line&quot;&gt;DAYS--${String(num).padStart(5,&quot;0&quot;)}&lt;/div&gt;
            &lt;div class=&quot;line&quot;&gt;WEEKS--${String(weekN).padStart(4,&quot;0&quot;)}&lt;/div&gt;
            &lt;div class=&quot;day-marker&quot;&gt;&lt;/div&gt;`;
          row.appendChild(card);
        }
        frag.appendChild(row);
      }
      content.innerHTML = &quot;&quot;;
      content.appendChild(frag);
    }

    function scrollToDate(date) {
      if (date &lt; BIRTH) date = BIRTH;
      if (date &gt; END) date = END;
      const weekIdx = Math.floor(daysBetween(firstWeekStart, startOfWeek(date)) / 7);
      scroller.scrollTop = Math.max(0, weekIdx * ROW_H - scroller.clientHeight / 3);
      requestAnimationFrame(renderDays);
    }

    // ─── Tooltip ─────────────────────────────────────────────────
    const tooltip = document.getElementById(&quot;tooltip&quot;);
    function showTooltip(e, title, dates, ages) {
      tooltip.querySelector(&quot;.tt-title&quot;).textContent = title;
      document.getElementById(&quot;ttDates&quot;).textContent = dates;
      document.getElementById(&quot;ttAges&quot;).textContent = ages;
      tooltip.classList.add(&quot;visible&quot;);
      moveTooltip(e);
    }
    function moveTooltip(e) {
      const pad = 12;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + 240 &gt; window.innerWidth - 6) x = e.clientX - 240 - pad;
      if (y + 80 &gt; window.innerHeight - 6) y = e.clientY - 80 - pad;
      tooltip.style.left = x + &quot;px&quot;;
      tooltip.style.top  = y + &quot;px&quot;;
    }
    function hideTooltip() { tooltip.classList.remove(&quot;visible&quot;); }

    // ─── Weeks ───────────────────────────────────────────────────
    function buildWeeksView() {
      const grid = document.getElementById(&quot;weeksGrid&quot;);
      grid.innerHTML = &quot;&quot;;
      const today = new Date(); today.setHours(0,0,0,0);
      let curWeek = lifeWeek(today);
      if (curWeek &lt; 1) curWeek = 1;
      if (curWeek &gt; TOTAL_WEEKS) curWeek = TOTAL_WEEKS;

      let lived = 0;
      for (let w = 1; w &lt;= TOTAL_WEEKS; w++) {
        const sq = document.createElement(&quot;div&quot;);
        sq.className = &quot;sq&quot;;
        if (w &lt; curWeek) { sq.classList.add(&quot;lived&quot;); lived++; }
        if (w === curWeek) sq.classList.add(&quot;current&quot;);

        const weekStart = addDays(firstWeekStart, (w - 1) * 7);
        const weekEnd   = addDays(weekStart, 6);
        const dStart = weekStart &lt; BIRTH ? BIRTH : weekStart;
        const dEnd   = weekEnd &gt; END ? END : weekEnd;

        sq.addEventListener(&quot;mouseenter&quot;, e =&gt; {
          showTooltip(e,
            `WEEKS--${String(w).padStart(4,&quot;0&quot;)}`,
            `${formatDate(dStart)} → ${formatDate(dEnd)}`,
            `${ageYMD(dStart).str()} → ${ageYMD(dEnd).str()}`
          );
        });
        sq.addEventListener(&quot;mousemove&quot;, moveTooltip);
        sq.addEventListener(&quot;mouseleave&quot;, hideTooltip);
        grid.appendChild(sq);
      }

      const remaining = TOTAL_WEEKS - lived - 1;
      document.getElementById(&quot;weeksStats&quot;).innerHTML = `
        &lt;span&gt;Lived &lt;strong&gt;${lived}&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;current-label&quot;&gt;Current &lt;strong&gt;${curWeek}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Remaining &lt;strong&gt;${Math.max(0,remaining)}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Total &lt;strong&gt;${TOTAL_WEEKS}&lt;/strong&gt;&lt;/span&gt;
      `;
    }

    // ─── Months ──────────────────────────────────────────────────
    function buildMonthsView() {
      const grid = document.getElementById(&quot;monthsGrid&quot;);
      grid.innerHTML = &quot;&quot;;
      const today = new Date(); today.setHours(0,0,0,0);
      let curMonth = lifeMonth(today);
      if (curMonth &lt; 1) curMonth = 1;
      if (curMonth &gt; TOTAL_MONTHS) curMonth = TOTAL_MONTHS;

      let lived = 0;
      for (let m = 1; m &lt;= TOTAL_MONTHS; m++) {
        const sq = document.createElement(&quot;div&quot;);
        sq.className = &quot;sq&quot;;
        if (m &lt; curMonth) { sq.classList.add(&quot;lived&quot;); lived++; }
        if (m === curMonth) sq.classList.add(&quot;current&quot;);

        let dStart = customMonthStart(m);
        let dEnd   = customMonthEnd(m);
        if (dStart &lt; BIRTH) dStart = BIRTH;
        if (dEnd &gt; END) dEnd = END;

        sq.addEventListener(&quot;mouseenter&quot;, e =&gt; {
          showTooltip(e,
            `MONTHS--${String(m).padStart(3,&quot;0&quot;)}`,
            `${formatDate(dStart)} → ${formatDate(dEnd)}`,
            `${ageYMD(dStart).str()} → ${ageYMD(dEnd).str()}`
          );
        });
        sq.addEventListener(&quot;mousemove&quot;, moveTooltip);
        sq.addEventListener(&quot;mouseleave&quot;, hideTooltip);
        grid.appendChild(sq);
      }

      const remaining = TOTAL_MONTHS - lived - 1;
      document.getElementById(&quot;monthsStats&quot;).innerHTML = `
        &lt;span&gt;Lived &lt;strong&gt;${lived}&lt;/strong&gt;&lt;/span&gt;
        &lt;span class=&quot;current-label&quot;&gt;Current &lt;strong&gt;${curMonth}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Remaining &lt;strong&gt;${Math.max(0,remaining)}&lt;/strong&gt;&lt;/span&gt;
        &lt;span&gt;Total &lt;strong&gt;${TOTAL_MONTHS}&lt;/strong&gt;&lt;/span&gt;
      `;
    }

    // ─── Tabs ────────────────────────────────────────────────────
    document.querySelectorAll(&quot;.tab-btn&quot;).forEach(btn =&gt; {
      btn.addEventListener(&quot;click&quot;, () =&gt; {
        document.querySelectorAll(&quot;.tab-btn&quot;).forEach(b =&gt; b.classList.remove(&quot;active&quot;));
        btn.classList.add(&quot;active&quot;);
        const tab = btn.dataset.tab;

        document.getElementById(&quot;dayView&quot;).classList.toggle(&quot;hidden&quot;, tab !== &quot;days&quot;);
        document.getElementById(&quot;weeksView&quot;).classList.toggle(&quot;active&quot;, tab === &quot;weeks&quot;);
        document.getElementById(&quot;monthsView&quot;).classList.toggle(&quot;active&quot;, tab === &quot;months&quot;);
      });
    });

    // ─── Events ──────────────────────────────────────────────────
    let ticking = false;
    scroller.addEventListener(&quot;scroll&quot;, () =&gt; {
      if (!ticking) {
        requestAnimationFrame(() =&gt; { renderDays(); ticking = false; });
        ticking = true;
      }
    });

    function goToDaysAndScroll(date) {
      document.querySelectorAll(&quot;.tab-btn&quot;).forEach(b =&gt; b.classList.remove(&quot;active&quot;));
      document.querySelector(&#x27;.tab-btn[data-tab=&quot;days&quot;]&#x27;).classList.add(&quot;active&quot;);
      document.getElementById(&quot;dayView&quot;).classList.remove(&quot;hidden&quot;);
      document.getElementById(&quot;weeksView&quot;).classList.remove(&quot;active&quot;);
      document.getElementById(&quot;monthsView&quot;).classList.remove(&quot;active&quot;);
      scrollToDate(date);
    }

    document.getElementById(&quot;jumpBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      const val = document.getElementById(&quot;jumpDate&quot;).value;
      if (!val) return;
      goToDaysAndScroll(new Date(val + &quot;T00:00:00&quot;));
    });

    document.getElementById(&quot;todayBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; goToDaysAndScroll(new Date()));
    document.getElementById(&quot;birthBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; goToDaysAndScroll(BIRTH));
    document.getElementById(&quot;endBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; goToDaysAndScroll(END));

    document.getElementById(&quot;jumpDate&quot;).addEventListener(&quot;keydown&quot;, e =&gt; {
      if (e.key === &quot;Enter&quot;) document.getElementById(&quot;jumpBtn&quot;).click();
    });

    const jumpDate = document.getElementById(&quot;jumpDate&quot;);
    jumpDate.addEventListener(&quot;click&quot;, () =&gt; {
      if (typeof jumpDate.showPicker === &quot;function&quot;) {
        try { jumpDate.showPicker(); } catch (_) {}
      }
    });

    // ─── Init ────────────────────────────────────────────────────
    updateProgressAndDaysStats();
    buildWeeksView();
    buildMonthsView();
    renderDays();
    requestAnimationFrame(() =&gt; scrollToDate(new Date()));

    jumpDate.value = new Date().toISOString().slice(0, 10);
    window.addEventListener(&quot;resize&quot;, () =&gt; renderDays());
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"

&lt;body&gt;
  &lt;div class=&quot;app&quot;&gt;
    &lt;header&gt;
      &lt;div class=&quot;page-title&quot;&gt;RITISH LAMSAL PERSONAL AGE CALENDAR&lt;/div&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;button class=&quot;nav-btn&quot; id=&quot;prevBtn&quot; aria-label=&quot;Previous&quot;&gt;‹&lt;/button&gt;
        &lt;select class=&quot;year-select&quot; id=&quot;yearSelect&quot; aria-label=&quot;Select year&quot;&gt;&lt;/select&gt;
        &lt;button class=&quot;nav-btn&quot; id=&quot;nextBtn&quot; aria-label=&quot;Next&quot;&gt;›&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;months-grid&quot; id=&quot;calendar&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    // ============================================================
    // ADD NEW YEARS HERE (just append the array)
    // [BAISAKH, JESTHA, ASHADH, SHRAWAN, BHADRA, ASHWIN,
    //  KARTIK, MANGSIR, POUSH, MAGH, FALGUN, CHAITRA]
    // ============================================================
    const DAYS_IN_MONTH = {
      2064: [31,31,32,32,31,30,30,29,30,29,30,30],
      2065: [31,32,31,32,31,30,30,30,29,29,30,31],
      2066: [31,31,31,32,31,31,29,30,30,29,29,31],
      2067: [31,31,32,31,31,31,30,29,30,29,30,30],
      2068: [31,31,32,32,31,30,30,29,30,29,30,30],
      2069: [31,32,31,32,31,30,30,30,29,29,30,31],
      2070: [31,31,31,32,31,31,29,30,30,29,30,30],
      2071: [31,31,32,31,31,31,30,29,30,29,30,30],
      2072: [31,32,31,32,31,30,30,29,30,29,30,30],
      2073: [31,32,31,32,31,30,30,30,29,29,30,31],
      2074: [31,31,31,32,31,31,30,29,30,29,30,30],
      2075: [31,31,32,31,31,31,30,29,30,29,30,30],
      2076: [31,32,31,32,31,30,30,30,29,29,30,30],
      2077: [31,32,31,32,31,30,30,30,29,30,29,31],
      2078: [31,31,31,32,31,31,30,29,30,29,30,30],
      2079: [31,31,32,31,31,31,30,29,30,29,30,30],
      2080: [31,32,31,32,31,30,30,30,29,29,30,30],
      2081: [31,32,31,32,31,30,30,30,29,30,29,31],
      2082: [31,31,32,31,31,31,30,29,30,29,30,30],
      2083: [31,31,32,31,31,30,30,30,29,30,30,30],
      2084: [31,31,32,31,31,30,30,30,29,30,30,30]
    };

    const MONTH_NAMES = [
      &quot;BAISAKH&quot;, &quot;JESTHA&quot;, &quot;ASHADH&quot;, &quot;SHRAWAN&quot;,
      &quot;BHADRA&quot;, &quot;ASHWIN&quot;, &quot;KARTIK&quot;, &quot;MANGSIR&quot;,
      &quot;POUSH&quot;, &quot;MAGH&quot;, &quot;FALGUN&quot;, &quot;CHAITRA&quot;
    ];

    const MONTH_SHORT = [&quot;BAI&quot;,&quot;JES&quot;,&quot;ASH&quot;,&quot;SHR&quot;,&quot;BHA&quot;,&quot;ASW&quot;,&quot;KAR&quot;,&quot;MAN&quot;,&quot;POU&quot;,&quot;MAG&quot;,&quot;FAL&quot;,&quot;CHA&quot;];
    const MONTH_ABBR = [&quot;JAN&quot;,&quot;FEB&quot;,&quot;MAR&quot;,&quot;APR&quot;,&quot;MAY&quot;,&quot;JUN&quot;,&quot;JUL&quot;,&quot;AUG&quot;,&quot;SEP&quot;,&quot;OCT&quot;,&quot;NOV&quot;,&quot;DEC&quot;];

    const REF_BS_YEAR = 2064;
    const REF_AD = new Date(2007, 3, 14);

    function daysBeforeMonth(year, monthIndex) {
      const days = DAYS_IN_MONTH[year];
      if (!days) return 0;
      let total = 0;
      for (let i = 0; i &lt; monthIndex; i++) total += days[i];
      return total;
    }

    function bsToAd(bsYear, monthIndex, day) {
      if (!DAYS_IN_MONTH[bsYear]) return null;
      let totalDays = 0;
      for (let y = REF_BS_YEAR; y &lt; bsYear; y++) {
        const d = DAYS_IN_MONTH[y];
        if (!d) return null;
        totalDays += d.reduce((a, b) =&gt; a + b, 0);
      }
      totalDays += daysBeforeMonth(bsYear, monthIndex);
      totalDays += (day - 1);
      const result = new Date(REF_AD.getTime());
      result.setDate(result.getDate() + totalDays);
      return result;
    }

    function getFiscalMonths(startYear) {
      const months = [];
      for (let m = 2; m &lt;= 11; m++) months.push({ year: startYear, monthIndex: m });
      months.push({ year: startYear + 1, monthIndex: 0 });
      months.push({ year: startYear + 1, monthIndex: 1 });
      return months;
    }

    function formatAdCompact(date) {
      if (!date) return &quot;&quot;;
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, &quot;0&quot;);
      const d = String(date.getDate()).padStart(2, &quot;0&quot;);
      return `${y} ${m}-${d}`;
    }

    function formatHover(year, monthIndex, day, ad) {
      const bs = `${year}-${MONTH_SHORT[monthIndex]}-${String(day).padStart(2,&quot;0&quot;)}`;
      const g = `${ad.getFullYear()}-${MONTH_ABBR[ad.getMonth()]}-${String(ad.getDate()).padStart(2,&quot;0&quot;)}`;
      return `${bs}  •  ${g}`;
    }

    function pad2(n) { return String(n).padStart(2, &quot;0&quot;); }

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &amp;&amp;
             d1.getMonth() === d2.getMonth() &amp;&amp;
             d1.getDate() === d2.getDate();
    }

    function yearLabel(bsStartYear) {
      return `YEAR-${String(bsStartYear - 2063).padStart(2, &quot;0&quot;)}`;
    }

    function getShiftAmount(daysInMonth, startWeekday) {
      if (daysInMonth === 29) return 0;
      if (daysInMonth === 30) return startWeekday === 6 ? 1 : 0;
      if (daysInMonth === 31) {
        if (startWeekday === 5) return 1;
        if (startWeekday === 6) return 2;
        return 0;
      }
      if (daysInMonth === 32) {
        if (startWeekday === 4) return 1;
        if (startWeekday === 5) return 2;
        if (startWeekday === 6) return 3;
        return 0;
      }
      return 0;
    }

    function renderDayCell(year, monthIndex, d, today) {
      const ad = bsToAd(year, monthIndex, d);
      if (!ad) return `&lt;div class=&quot;day empty&quot;&gt;&lt;/div&gt;`;

      const isWeekend = ad.getDay() === 0 || ad.getDay() === 6;
      const isToday = isSameDay(ad, today);
      const classes = [&quot;day&quot;];
      if (isWeekend) classes.push(&quot;weekend&quot;);
      if (isToday) classes.push(&quot;today&quot;);

      return `
        &lt;div class=&quot;${classes.join(&quot; &quot;)}&quot; title=&quot;${formatHover(year, monthIndex, d, ad)}&quot;&gt;
          &lt;span class=&quot;bs-day&quot;&gt;${pad2(d)}&lt;/span&gt;
          &lt;span class=&quot;ad-day&quot;&gt;${formatAdCompact(ad)}&lt;/span&gt;
        &lt;/div&gt;
      `;
    }

    function renderMonth(year, monthIndex) {
      const daysInMonth = DAYS_IN_MONTH[year]?.[monthIndex];
      if (!daysInMonth) return &quot;&quot;;

      const firstAd = bsToAd(year, monthIndex, 1);
      if (!firstAd) return &quot;&quot;;

      const startWeekday = firstAd.getDay();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const shift = getShiftAmount(daysInMonth, startWeekday);

      let html = `
        &lt;div class=&quot;month-card&quot;&gt;
          &lt;div class=&quot;month-header&quot;&gt;
            &lt;span class=&quot;month-name&quot;&gt;${MONTH_NAMES[monthIndex]} ${year}&lt;/span&gt;
            &lt;span class=&quot;month-sub&quot;&gt;${daysInMonth}D&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;weekdays&quot;&gt;
            &lt;span&gt;SUN&lt;/span&gt;&lt;span&gt;MON&lt;/span&gt;&lt;span&gt;TUE&lt;/span&gt;&lt;span&gt;WED&lt;/span&gt;&lt;span&gt;THU&lt;/span&gt;&lt;span&gt;FRI&lt;/span&gt;&lt;span&gt;SAT&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;days&quot;&gt;
      `;

      if (shift === 0) {
        for (let i = 0; i &lt; startWeekday; i++) html += `&lt;div class=&quot;day empty&quot;&gt;&lt;/div&gt;`;
        for (let d = 1; d &lt;= daysInMonth; d++) html += renderDayCell(year, monthIndex, d, today);
      } else {
        for (let d = daysInMonth - shift + 1; d &lt;= daysInMonth; d++) {
          html += renderDayCell(year, monthIndex, d, today);
        }
        const empties = (startWeekday - shift + 7) % 7;
        for (let i = 0; i &lt; empties; i++) html += `&lt;div class=&quot;day empty&quot;&gt;&lt;/div&gt;`;
        for (let d = 1; d &lt;= daysInMonth - shift; d++) {
          html += renderDayCell(year, monthIndex, d, today);
        }
      }

      html += `&lt;/div&gt;&lt;/div&gt;`;
      return html;
    }

    function getAvailableFiscalYears() {
      const years = Object.keys(DAYS_IN_MONTH).map(Number).sort((a, b) =&gt; a - b);
      return years.filter(y =&gt; DAYS_IN_MONTH[y + 1]);
    }

    function findFiscalYearForDate(date) {
      const available = getAvailableFiscalYears();
      for (const y of available) {
        const first = bsToAd(y, 2, 1);
        const last = bsToAd(y + 1, 1, DAYS_IN_MONTH[y + 1][1]);
        if (first &amp;&amp; last &amp;&amp; date &gt;= first &amp;&amp; date &lt;= last) return y;
      }
      return available[0] || 2064;
    }

    let currentYear = 2064;

    function populateSelect() {
      const select = document.getElementById(&quot;yearSelect&quot;);
      const available = getAvailableFiscalYears();
      select.innerHTML = &quot;&quot;;
      available.forEach(y =&gt; {
        const opt = document.createElement(&quot;option&quot;);
        opt.value = y;
        opt.textContent = `${yearLabel(y)}  (${y} ASH – ${y + 1} JES)`;
        select.appendChild(opt);
      });
    }

    function render() {
      const container = document.getElementById(&quot;calendar&quot;);
      const available = getAvailableFiscalYears();
      if (!available.includes(currentYear)) currentYear = available[0] || 2064;

      let html = &quot;&quot;;
      getFiscalMonths(currentYear).forEach(({ year, monthIndex }) =&gt; {
        html += renderMonth(year, monthIndex);
      });
      container.innerHTML = html;

      document.getElementById(&quot;yearSelect&quot;).value = currentYear;
      const idx = available.indexOf(currentYear);
      document.getElementById(&quot;prevBtn&quot;).disabled = idx &lt;= 0;
      document.getElementById(&quot;nextBtn&quot;).disabled = idx &gt;= available.length - 1;
    }

    populateSelect();
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    currentYear = findFiscalYearForDate(today);
    render();

    document.getElementById(&quot;prevBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      const available = getAvailableFiscalYears();
      const idx = available.indexOf(currentYear);
      if (idx &gt; 0) { currentYear = available[idx - 1]; render(); }
    });

    document.getElementById(&quot;nextBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
      const available = getAvailableFiscalYears();
      const idx = available.indexOf(currentYear);
      if (idx &lt; available.length - 1) { currentYear = available[idx + 1]; render(); }
    });

    document.getElementById(&quot;yearSelect&quot;).addEventListener(&quot;change&quot;, (e) =&gt; {
      currentYear = parseInt(e.target.value, 10);
      render();
    });
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"
      ></iframe>
    </main>
  </div>

  <script>
    const navItems = document.querySelectorAll(".nav-item");
    const panels = document.querySelectorAll(".panel");
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");

    function openSidebar() {
      sidebar.classList.add("open");
      menuBtn.classList.add("open");
      overlay.classList.add("visible");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      menuBtn.classList.remove("open");
      overlay.classList.remove("visible");
    }

    function toggleSidebar() {
      if (sidebar.classList.contains("open")) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleSidebar();
    });

    overlay.addEventListener("click", closeSidebar);

    function switchPanel(name) {
      navItems.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.panel === name);
      });
      panels.forEach(panel => {
        panel.classList.toggle("active", panel.id === "panel-" + name);
      });
      closeSidebar();
    }

    navItems.forEach(btn => {
      btn.addEventListener("click", () => switchPanel(btn.dataset.panel));
    });
  </script>
</body>
</html>
